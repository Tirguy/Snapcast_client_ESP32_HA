[platformio]
default_envs = esp32
src_dir = src
include_dir = include

[common]
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DBOARD_HAS_PSRAM
    -DCONFIG_I2S_SKIP_LEGACY_CONFLICT_CHECK=1
    -DCONFIG_SPIRAM_MEMTEST_ENABLE=0
    -Wall
    -O2
    -std=gnu++17
lib_deps =
    bblanchon/ArduinoJson@^6.21.5

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}

board_build.partitions = partitions.csv
board_build.psram = enabled
build_flags =
    ${common.build_flags}
    -DCONFIG_FREERTOS_HZ=1000
    -DCONFIG_FREERTOS_MAX_TASK_NAME_LEN=16
lib_deps =
    ${common.lib_deps}
monitor_port = /dev/ttyUSB1
upload_port = /dev/ttyUSB1

[env:esp32-s3]
extends = env:esp32
board = esp32-s3-devkitc-1
build_flags =
    ${common.build_flags}
    -DCONFIG_FREERTOS_HZ=1000
    -DCONFIG_FREERTOS_MAX_TASK_NAME_LEN=16
    -DBOARD_ESP32_S3=1

[env:esp32-debug]
extends = env:esp32
build_flags =
    ${common.build_flags}
    -DCONFIG_FREERTOS_HZ=1000
    -DCONFIG_FREERTOS_MAX_TASK_NAME_LEN=16
    -D DEBUG=1
    -DAPP_LOG_LEVEL=4

[env:esp32-release]
extends = env:esp32
build_flags =
    ${common.build_flags}
    -DCONFIG_FREERTOS_HZ=1000
    -DCONFIG_FREERTOS_MAX_TASK_NAME_LEN=16
    -D NDEBUG
    -DAPP_LOG_LEVEL=2

